# Dev tooling only: runtime dependencies are installed by install.sh.
[project]
name = "tts-qwen3-ru-srv"
version = "1.1.0"
requires-python = ">=3.11"

[dependency-groups]
dev = ["pre-commit", "pytest"]

[tool.ruff]
target-version = "py311"  # runtime minimum, see install.sh
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S310"]  # urlopen on a configured local URL is intended

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
